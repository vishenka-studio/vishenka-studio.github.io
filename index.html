<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fffff5}
body{font-family:Georgia,serif}
.page{min-height:100svh;display:flex;justify-content:center;align-items:flex-start}
.artboard{position:relative;width:100%;max-width:758px;isolation:isolate}
.design{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
/* Original composition stays proportional: no cover cropping on tall phones. */
.light,.hit{position:absolute}
.light{pointer-events:none;z-index:1}
.cherry-light{left:29.8%;top:21.2%;width:25.6%;height:11.5%;border-radius:48% 48% 48% 48%;overflow:hidden;mix-blend-mode:screen;transform:rotate(-8deg)}
.cherry-light::before{content:"";position:absolute;inset:-50% -140%;background:linear-gradient(108deg,transparent 43%,rgba(255,234,207,.03) 46%,rgba(255,249,232,.48) 49%,rgba(255,255,255,.13) 51%,transparent 55%);animation:cherry-glint 8s ease-in-out infinite}
.shadow-light{left:37%;top:29.3%;width:40%;height:6.4%;border-radius:50%;background:radial-gradient(ellipse at 30% 40%,rgba(255,207,127,.48),rgba(244,106,67,.1) 35%,transparent 66%);mix-blend-mode:screen;transform-origin:25% 40%;animation:caustic 6s ease-in-out infinite}
.hit{z-index:3;display:block;text-decoration:none;color:transparent;cursor:pointer;touch-action:manipulation}
.primary{left:8.05%;top:63.88%;width:85.9%;height:7.9%;border-radius:999px;overflow:hidden;box-shadow:0 6px 16px rgba(115,0,25,.08);animation:invitation 4.8s ease-in-out infinite}
.primary::before{content:"";position:absolute;inset:-100% -50%;background:linear-gradient(110deg,transparent 39%,rgba(255,234,211,.08) 44%,rgba(255,244,225,.25) 49%,rgba(255,234,211,.07) 54%,transparent 59%);transform:translateX(-70%);animation:button-glint 6s ease-in-out infinite}
.primary::after{content:"";position:absolute;inset:1px;border-radius:inherit;border:1px solid rgba(255,228,209,.22)}
.secondary{left:8.5%;width:84%;height:7.5%;border-radius:8px;transition:background .2s}
.channel{top:73.1%}.course{top:81.8%}
.hit:focus-visible{outline:3px solid #680019;outline-offset:5px}
.primary:active{transform:scale(.98)}
@media(hover:hover){.primary:hover{filter:brightness(1.13)}.secondary:hover{background:rgba(130,0,30,.045)}}
@keyframes cherry-glint{0%,20%{transform:translateX(-32%);opacity:0}29%{opacity:.8}49%{transform:translateX(32%);opacity:0}100%{transform:translateX(32%);opacity:0}}
@keyframes caustic{0%,100%{opacity:.2;transform:scale(.94) rotate(-3deg)}50%{opacity:.65;transform:scale(1.06) rotate(3deg)}}
@keyframes invitation{0%,100%{box-shadow:0 5px 14px rgba(115,0,25,.08)}50%{box-shadow:0 8px 26px rgba(150,0,35,.22)}}
@keyframes button-glint{0%,40%{transform:translateX(-70%)}75%,100%{transform:translateX(70%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.shadow-light{opacity:.2}}
</style>
