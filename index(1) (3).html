<title>Vishenka Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #160104;
  }

  body {
    font-family: "Montserrat", sans-serif;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    display: flex;
    justify-content: center;
    background: #160104;
  }

  /*
    Весь утверждённый дизайн — один точный визуальный слой.
    Поэтому корзина, вишни, тени листьев, фото, логотип,
    размеры карточек и расстояния совпадают с макетом пиксель-в-пиксель.
  */
  .artboard {
    position: relative;
    width: min(100vw, 853px);
    aspect-ratio: 853 / 1280;
    flex: 0 0 auto;
    overflow: hidden;
    background: #160104;
  }

  .artboard > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /*
    Невидимые кликабельные зоны лежат ровно поверх трёх карточек.
    Визуально ничего не меняют.
  */
  .hit {
    position: absolute;
    z-index: 10;
    display: block;
    left: 15.24%;
    width: 70.58%;
    border-radius: 1.75%;
    text-decoration: none;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }

  .hit.one {
    top: 53.91%;
    height: 10.08%;
  }

  .hit.two {
    top: 64.53%;
    height: 10.16%;
  }

  .hit.three {
    top: 75.39%;
    height: 10.16%;
  }

  /*
    Нижняя надпись перерисована:
    AI теперь тем же Montserrat, что и соседний текст,
    а не рукописным маркером.
  */
  .footer-copy {
    position: absolute;
    z-index: 12;
    left: 50%;
    top: 97.12%;
    transform: translate(-50%, -50%);
    white-space: nowrap;

    font-family: "Montserrat", sans-serif;
    font-size: calc(min(100vw, 853px) * 0.01055);
    font-weight: 500;
    line-height: 1;
    letter-spacing: calc(min(100vw, 853px) * 0.00415);

    color: rgba(226, 190, 187, 0.72);
    text-transform: uppercase;
    pointer-events: none;
  }

  .footer-copy .ai {
    font: inherit;
    letter-spacing: inherit;
    color: #d84b60;
  }

  @media (min-width: 854px) {
    .footer-copy {
      font-size: 9px;
      letter-spacing: 3.54px;
    }
  }
</style>
</head>
