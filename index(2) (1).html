<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Vishenka Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #160104;
}

body {
  overflow-x: hidden;
  font-family: "Montserrat", sans-serif;
}

.page {
  position: relative;
  width: 100%;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  overflow: hidden;
  background: #160104;
}

/*
  Макет 853x1280.
  На мобильном он теперь масштабируется "cover" по высоте,
  поэтому снизу больше нет пустого участка.
  Если экран выше пропорции макета — чуть режутся только боковые края.
*/
.artboard {
  position: relative;
  flex: 0 0 auto;
  width: min(100vw, 853px);
  aspect-ratio: 853 / 1280;
  overflow: hidden;
  background: #160104;
}

.artboard > .design-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: fill;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* Внешний аватар. Никакой фотографии внутри HTML нет. */
.avatar-live {
  position: absolute;
  z-index: 6;

  left: 50.18%;
  top: 10.00%;
  width: 34.94%;
  aspect-ratio: 1 / 1;

  transform: translateX(-50%);
  border-radius: 50%;
  overflow: hidden;

  background-image: url("./avatar.jpg");
  background-size: cover;
  background-position: 50% 42%;
  background-repeat: no-repeat;

  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
}

/* Кликабельные зоны */
.hit {
  position: absolute;
  z-index: 10;
  display: block;

  left: 15.24%;
  width: 70.58%;

  background: transparent;
  text-decoration: none;
  border-radius: 16px;
  cursor: pointer;
  touch-action: manipulation;
}

.hit.one {
  top: 53.91%;
  height: 10.08%;
}

.hit.two {
  top: 64.53%;
  height: 10.16%;
}

.hit.three {
  top: 75.39%;
  height: 10.16%;
}

/* Нижняя строка — AI тем же шрифтом, что и остальной текст */
.footer-copy {
  position: absolute;
  z-index: 12;

  left: 50%;
  top: 97.05%;
  transform: translate(-50%, -50%);

  white-space: nowrap;
  pointer-events: none;

  font-family: "Montserrat", sans-serif;
  font-size: calc(min(100vw, 853px) * 0.01055);
  font-weight: 500;
  line-height: 1;
  letter-spacing: calc(min(100vw, 853px) * 0.00415);

  color: rgba(226,190,187,.72);
  text-transform: uppercase;
}

.footer-copy .ai {
  font: inherit;
  letter-spacing: inherit;
  color: #d84b60;
}

/*
  Главный фикс мобильной версии.
  Берём либо ширину экрана, либо ширину, необходимую для заполнения 100dvh.
  Из-за этого артборд всегда доходит до низа видимой области.
*/
@media (max-width: 600px) {
  .artboard {
    width: max(100vw, calc(100dvh * 853 / 1280));
    max-width: none;
  }

  .footer-copy {
    font-size: calc(max(100vw, calc(100dvh * 853 / 1280)) * 0.01055);
    letter-spacing: calc(max(100vw, calc(100dvh * 853 / 1280)) * 0.00415);
  }
}

@media (min-width: 854px) {
  .footer-copy {
    font-size: 9px;
    letter-spacing: 3.54px;
  }
}
</style>
</head>
