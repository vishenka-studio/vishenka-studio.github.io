<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Vishenka Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --cream:#f4d1cb;
  --muted:#dcc5c0;
  --accent:#bd2941;
  --accent2:#8f1025;
  --line:rgba(246,210,205,.48);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#120103}
body{
  font-family:'Montserrat',sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(172,39,55,.74) 0%, rgba(91,10,20,.72) 30%, rgba(43,3,9,.96) 66%, #120103 100%);
}

.page{
  position:relative;
  width:100%;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
}

.page::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-5;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.20),transparent 18%,transparent 82%,rgba(0,0,0,.28)),
    linear-gradient(180deg,transparent 45%,rgba(0,0,0,.28) 100%);
}

.container{
  position:relative;
  z-index:5;
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:max(34px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Static leaf shadows */
.shadow{
  position:absolute;
  pointer-events:none;
  z-index:-3;
  opacity:.22;
  filter:blur(7px);
}
.shadow.left{
  width:235px;height:310px;left:-105px;top:15px;transform:rotate(-24deg);
  background:
    radial-gradient(ellipse at 30% 18%,#000 0 22%,transparent 23%),
    radial-gradient(ellipse at 73% 37%,#000 0 23%,transparent 24%),
    radial-gradient(ellipse at 34% 63%,#000 0 24%,transparent 25%),
    radial-gradient(ellipse at 71% 84%,#000 0 22%,transparent 23%);
}
.shadow.right{
  width:220px;height:300px;right:-110px;top:350px;transform:rotate(26deg);
  background:
    radial-gradient(ellipse at 35% 18%,#000 0 23%,transparent 24%),
    radial-gradient(ellipse at 72% 45%,#000 0 24%,transparent 25%),
    radial-gradient(ellipse at 32% 73%,#000 0 24%,transparent 25%);
}

/* Decorative cherries */
.cherry-deco{position:absolute;z-index:-2;pointer-events:none}
.cherry-deco.top{top:-2px;right:-24px;width:165px;height:175px}
.cherry-deco.bottom{left:-36px;bottom:8px;width:175px;height:190px;transform:rotate(8deg)}
.fruit{
  position:absolute;width:49px;height:49px;border-radius:50%;
  background:radial-gradient(circle at 30% 23%,rgba(255,255,255,.9) 0 4%,rgba(255,139,151,.42) 8%,#c51b34 31%,#87091c 63%,#43030a 100%);
  box-shadow:inset -8px -10px 14px rgba(30,0,5,.52),0 9px 18px rgba(0,0,0,.34);
}
.stem{position:absolute;width:2px;background:linear-gradient(#9b8647,#443815);transform-origin:top center}
.leaf{
  position:absolute;width:76px;height:34px;border-radius:100% 0 100% 0;
  background:linear-gradient(135deg,#7d8837,#425315 48%,#1e2a08 100%);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.25);
}
.top .f1{top:83px;left:30px} .top .f2{top:61px;left:83px} .top .f3{top:112px;left:82px}
.top .s1{height:99px;left:63px;top:0;transform:rotate(29deg)} .top .s2{height:92px;left:67px;top:0;transform:rotate(55deg)} .top .s3{height:126px;left:65px;top:0;transform:rotate(15deg)}
.top .leaf{top:9px;left:0;transform:rotate(-20deg)}
.bottom .f1{top:89px;left:26px} .bottom .f2{top:121px;left:71px} .bottom .f3{top:135px;left:9px}
.bottom .s1{height:111px;left:55px;top:2px;transform:rotate(-15deg)} .bottom .s2{height:136px;left:56px;top:2px;transform:rotate(-34deg)} .bottom .s3{height:145px;left:57px;top:2px;transform:rotate(-2deg)}
.bottom .leaf{top:18px;left:58px;transform:rotate(17deg)}

/* Avatar */
.avatar-area{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.avatar-ring{position:absolute;width:178px;height:178px;border-radius:50%;border:1px solid rgba(238,102,119,.80);box-shadow:0 0 0 1px rgba(255,255,255,.03),0 0 26px rgba(203,38,60,.13)}
.avatar{position:relative;z-index:2;width:156px;height:156px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#3a050b;box-shadow:0 13px 28px rgba(0,0,0,.40)}
.avatar img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 41%;transform:scale(1.11)}
.avatar-star{position:absolute;z-index:3;top:-1px;left:50%;transform:translateX(-50%);padding:0 7px;background:#821725;color:#e87886;font-size:16px;line-height:19px}

/* Branding */
.brand{width:100%;text-align:center}
.brand-title{
  position:relative;display:inline-block;margin:0;
  font-family:'Cormorant Garamond',serif;font-size:clamp(68px,17vw,90px);font-weight:500;
  line-height:.80;letter-spacing:-4px;color:var(--cream);text-shadow:0 5px 14px rgba(0,0,0,.18);
}
.brand-title::after{content:"";position:absolute;width:16px;height:8px;right:2px;top:2px;border-radius:100% 0 100% 0;background:#f1cec9;transform:rotate(-24deg)}
.studio-row{width:100%;margin-top:-2px;display:flex;align-items:center;justify-content:center;gap:13px}
.studio-line{width:78px;height:1px;background:linear-gradient(90deg,transparent,rgba(236,147,151,.54))}
.studio-line.right{transform:scaleX(-1)}
.studio{font-family:'Allura',cursive;font-size:56px;line-height:.82;font-weight:400;color:#dc6f7c;white-space:nowrap;transform:rotate(-2deg)}
.subtitle{margin:21px 0 12px;font-size:15px;line-height:1.45;font-weight:400;letter-spacing:.25px;color:#dfcac7;text-align:center}

/* dots */
.dots{
  width:82px;height:31px;align-self:flex-start;margin-left:3px;margin-bottom:-7px;opacity:.55;
  background-image:radial-gradient(circle,#c7485a 1px,transparent 1.35px);background-size:12px 12px;
  -webkit-mask-image:radial-gradient(ellipse at left center,#000 0%,transparent 78%);mask-image:radial-gradient(ellipse at left center,#000 0%,transparent 78%);
}

/* Cards */
.links{width:100%;display:flex;flex-direction:column;gap:10px}
.link-card{
  width:100%;min-height:98px;display:grid;grid-template-columns:66px minmax(0,1fr) 39px;align-items:center;gap:16px;
  padding:12px 17px 12px 14px;text-decoration:none;color:#fff;border-radius:15px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(77,13,23,.53),rgba(31,3,7,.60));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 11px 27px rgba(0,0,0,.14);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.link-card:active{transform:scale(.985)}
@media(hover:hover){.link-card:hover{transform:translateY(-2px);border-color:rgba(255,218,213,.72);background:linear-gradient(135deg,rgba(94,16,28,.62),rgba(39,3,9,.62))}}

.icon-box{
  width:59px;height:59px;display:flex;align-items:center;justify-content:center;border-radius:13px;
  border:1px solid rgba(255,255,255,.10);background:linear-gradient(145deg,#bd2b43,#870c20);
  box-shadow:inset 0 1px 7px rgba(255,255,255,.08),0 6px 15px rgba(0,0,0,.18);
}
.icon-box svg{width:31px;height:31px;fill:#fff;stroke:#fff}
.link-content{min-width:0}
.link-title{margin:0 0 6px;font-size:16px;line-height:1.14;font-weight:600;letter-spacing:.2px;text-transform:uppercase;color:#ffe8e5}
.link-description{margin:0;font-size:12.5px;line-height:1.4;font-weight:400;color:#dfc9c6}
.new-badge{display:inline-flex;align-items:center;justify-content:center;margin-left:7px;padding:5px 11px 4px;border-radius:30px;vertical-align:middle;font-size:10px;line-height:1;font-weight:600;letter-spacing:1.2px;color:#ffe8e6;background:linear-gradient(135deg,#cf3e54,#99182d)}
.arrow{width:37px;height:37px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(145deg,#bd3046,#97162b);box-shadow:inset 0 1px 4px rgba(255,255,255,.11),0 4px 10px rgba(0,0,0,.17)}
.arrow svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Footer */
.footer{width:100%;margin-top:18px;display:flex;flex-direction:column;align-items:center}
.footer-decoration{width:100%;margin-bottom:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.footer-line{width:32px;height:1px;background:linear-gradient(90deg,transparent,rgba(220,112,125,.58))}
.footer-line.right{transform:scaleX(-1)}
.footer-star{font-size:15px;color:#d75b6c}
.heart{margin-bottom:13px;font-family:Arial,sans-serif;font-size:25px;line-height:1;font-weight:300;color:#a62437}
.copyright{font-family:'Montserrat',sans-serif;font-size:9px;line-height:1.4;font-weight:500;letter-spacing:3.7px;text-align:center;white-space:nowrap;color:rgba(233,196,192,.69)}
.copyright-ai{font:inherit;letter-spacing:inherit;color:#d94a60}

@media(max-width:420px){
  .container{padding-left:17px;padding-right:17px}
  .avatar-area{width:178px;height:178px}
  .avatar-ring{width:166px;height:166px}
  .avatar{width:146px;height:146px}
  .brand-title{font-size:clamp(63px,18vw,78px);letter-spacing:-3px}
  .studio{font-size:52px}
  .studio-line{width:65px}
  .subtitle{font-size:13.5px}
  .link-card{min-height:94px;grid-template-columns:58px minmax(0,1fr) 35px;gap:13px;padding:10px 13px 10px 11px}
  .icon-box{width:55px;height:55px}
  .icon-box svg{width:29px;height:29px}
  .link-title{font-size:14px}
  .link-description{font-size:11.5px}
  .arrow{width:34px;height:34px}
  .copyright{font-size:8px;letter-spacing:3px}
  .cherry-deco.top{right:-45px;transform:scale(.90);transform-origin:top right}
  .cherry-deco.bottom{left:-50px;transform:rotate(8deg) scale(.90);transform-origin:bottom left}
}
</style>
</head>
